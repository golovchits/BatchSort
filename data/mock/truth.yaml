# Ruler measurements of our own parcels, written before any code sees them.
# 13 parcels: 7 dev for building and tuning, 6 test kept off camera until step 11.
# The split was picked by hand from the ruler sizes, so both sets hold each kind of parcel.
#
# length, width: the footprint as the parcel lies on its biggest face, outermost points, in cm.
# height: from the table to the highest point as it lies. For soft parcels, rest a light book
#   on top without pressing and measure to its underside.
# Round to 0.5 cm. soft: yes for mailers and bags, no for boxes. Soft sizes can be several cm off.
# note: the number first written on the parcel, before the split.

dev:
  D01: {length: 19, width: 12.5, height: 14, soft: no, note: "was D02"}
  D02: {length: 39, width: 35, height: 0.5, soft: yes, note: "was D04"}
  D03: {length: 34, width: 22, height: 12.5, soft: no, note: "was D05"}
  D04: {length: 36, width: 34, height: 10.5, soft: yes, note: "was D06"}
  D05: {length: 41, width: 45, height: 18, soft: yes, note: "was D08"}
  D06: {length: 20, width: 13.5, height: 7, soft: no, note: "was D09"}
  D07: {length: 63.5, width: 29, height: 35.5, soft: no, note: "was D12, too big for every compartment"}

test:
  T01: {length: 16.5, width: 13, height: 7.5, soft: no, note: "was D01"}
  T02: {length: 28.5, width: 19, height: 9.5, soft: no, note: "was D03"}
  T03: {length: 40, width: 31, height: 11, soft: no, note: "was D07"}
  T04: {length: 30, width: 22, height: 10, soft: no, note: "was D10"}
  T05: {length: 45, width: 27, height: 20, soft: no, note: "was D11"}
  T06: {length: 51.5, width: 11, height: 15.5, soft: no, note: "was D13"}
